<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Layer 1 storage checks</title>
<body><h1>Layer 1 storage checks</h1><pre id="results">Running…</pre>
<script type="module">
import {runStorageChecks} from '../storage-checks.js';
const lines = [];
try {
    await runStorageChecks(message => {lines.push(`PASS: ${message}`); results.textContent = lines.join('\n');});
    document.body.dataset.result = 'pass';
} catch (error) {
    results.textContent += `\nFAIL: ${error.stack}`;
    document.body.dataset.result = 'fail';
}
</script></body></html>
